<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login- LensenFlix</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main>
        <div class="conteudo-total">
            <div class="metade-logo">
                <img src="../imagens/logo.png" alt="">
            </div>

            <div class="metade-login">
                <div class="login-board">
                    <h2>Cadastro de Usuário</h2>
                    <span>Digite seu nome completo:</span>
                    <input type="text" placeholder="Nome completo..." id="nome" class="input">
                    <span>Digite seu nome de usuário:</span>
                    <input type="text" placeholder="Nome de usuário..." id="nome-usuario" class="input">
                    <span>Digite seu email:</span>
                    <input type="text" placeholder="Email..." id="email" class="input">
                    <span>Digite sua senha:</span>
                    <input type="text" placeholder="Senha..." id="senha" class="input">
                    <span>Escolha um tipo de assinatura:</span>
                    <select id="assinatura">
                        <option value="ANUNCIOS">Com anúncios</option>
                        <option value="SEM-ANUNCIOS">Sem anúncios!</option>
                    </select>
                    <div class="button-container">
                        <button class="button" id="cadastro-button"><strong>CADASTRAR</strong></button>
                    </div>
                    <span id="feedback"></span>
                </div>
            </div>
        </div>
    </main>

    <script src="tela_cadastro-script.js"></script>
</body>
</html>
