<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login- LensenFlix</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="detalhes-style.css">
</head>
<body>
    <div class="tela" data-model-id="16:30">
        <header class="header" >
            <div class="circle-logo" >
                <img class="logo" src="../imagens/logo.png">
            </div>
            <img src="../imagens/logout-icon.png" id="logout">
        </header>
        
        <div class="main">
            <div class="conteudo-detalhes" id="conteudo-detalhes">
                <div class="centralizado">
                    <div class="id" id="id">ID:</div>
                    <div class="video" id="video"></div>
                </div>
                <div class="detalhes">
                    <div class="text-wrapper" id="titulo">Título do Conteúdo:</div>
                    <div class="text-wrapper" id="link">Link de acesso:</div>
                </div>
            </div>
        </div>
    </div>

    <script src="detalhes-script.js"></script>
</body>
</html>
