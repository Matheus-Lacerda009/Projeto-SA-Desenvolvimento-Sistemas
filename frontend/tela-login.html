<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login- LensenFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="conteudo-total">
            <div class="metade-logo">
                <img src="imagens/logo.png" alt="">
            </div>

            <div class="metade-login">
                <div class="login-board">
                    <h2>Login</h2>
                    <span>Digite seu nome de usuáro ou email:</span>
                    <input type="text" placeholder="Nome de usuário ou email" id="email-input" class="input">
                    <span>Digite sua senha:</span>
                    <input type="password" placeholder="Senha" id="password-input" class="input">
                    <div class="button-container">
                        <button class="button"><strong>ENTRAR</strong></button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
